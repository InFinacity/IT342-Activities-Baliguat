<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Contact</title>
  <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0e6f8; /* Light purple background */
            color: #333;
        }

        h2 {
            color: #6a0dad; /* Dark purple for headings */
        }

        form {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #6a0dad; /* Dark purple label */
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #d8b4fe; /* Light purple border */
            border-radius: 4px;
        }

        button[type="submit"] {
            width: 50%;
            background-color: #9370db; /* Medium purple for buttons */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            padding: 10px;
            align-self: center;
        }

        button[type="submit"]:hover {
            background-color: #800080; /* Darker purple on hover */
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #9370db; /* Medium purple link */
        }

        a:hover {
            text-decoration: underline;
            color: #800080; /* Darker purple on hover */
        }
    </style>
</head>
<body>

<h2>Create New Contact</h2>

<form action="/contacts" method="post">
  <label for="givenName">Given Name:</label>
  <input type="text" id="givenName" name="givenName" required>
  <label for="familyName">Family Name:</label>
  <input type="text" id="familyName" name="familyName" required>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email">
  <label for="phoneNumber">Phone Number:</label>
  <input type="tel" id="phoneNumber" name="phoneNumber">
  <button type="submit">Save Contact</button>
</form>
<a href="/contacts">Back to Contacts</a>
</body>
</html>
