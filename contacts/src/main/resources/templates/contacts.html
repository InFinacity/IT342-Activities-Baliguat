<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contacts List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0e6f8; /* Light purple background */
        }

        h2 {
            color: #6a0dad; /* Dark purple for headings */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d8b4fe; /* Light purple border */
        }

        th {
            background-color: #9370db; /* Medium purple for header */
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f0fe; /* Lighter purple for even rows */
        }

        .no-data {
            color: #808080; /* Gray for no data */
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }

        .edit-btn {
            background-color: #ba55d3; /* Medium purple for edit */
            color: white;
        }

        .delete-btn {
            background-color: #8b008b; /* Darker purple for delete */
            color: white;
        }

        form {
            display: inline;
        }

        button[type="submit"] {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            background-color: #9370db; /* Medium purple for buttons */
            color: white;
            border: none;
        }

        button[type="submit"]:hover {
            background-color: #800080; /* Darker purple on hover */
        }
    </style>
</head>
<body>

<h2>Contact List</h2>

<form action="/add-contact" method="get" style="margin-top: 20px; margin-bottom: 40px;">
    <button type="submit">Add Contact</button>
</form>
<form action="/logout" method="get" style="margin-top: 20px; margin-bottom: 40px; align-self: flex-end;">
    <button type="submit">Logout</button>
</form>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Email Address</th>
        <th>Phone Number</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contact : ${contacts}">
        <td th:text="${contact.names != null and #lists.size(contact.names) > 0 ? contact.names[0].displayName : 'No name'}"></td>
        <td>
                <span th:if="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}"
                      th:text="${contact.emailAddresses[0].value}"></span>
            <span th:unless="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}" class="no-data">
                    No email
                </span>
        </td>
        <td>
                <span th:if="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}"
                      th:text="${contact.phoneNumbers[0].value}"></span>
            <span th:unless="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}" class="no-data">
                    No phone
                </span>
        </td>
        <td class="actions">
            <form th:action="@{/edit-contact}" method="get" style="margin: 0;">
                <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
                <button type="submit" class="edit-btn">Edit</button>
            </form>

            <form th:action="@{/delete-contact}" method="post" style="margin: 0;">
                <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
                <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this contact?');">
                    Delete
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
